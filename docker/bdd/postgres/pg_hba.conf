# =============================================================================
# pg_hba.conf — Contrôle d'accès PostgreSQL (projet Catalogue)
# =============================================================================
# Politique : refus par défaut, autorisations explicites uniquement.
# Monté en read-only via docker-compose.
#
# TYPE    DATABASE        USER              ADDRESS          METHOD

# --- Connexions locales (socket Unix) ---
# Nécessaire pour les init scripts Docker, pg_isready, maintenance
local   all             catalogue_admin                    trust

# --- Connexions TCP depuis le réseau Docker (172.16.0.0/12) ---
host    catalogue       app_user          172.16.0.0/12    scram-sha-256
host    catalogue       migrator          172.16.0.0/12    scram-sha-256
host    all             catalogue_admin   172.16.0.0/12    scram-sha-256

# --- Refus explicite de tout le reste ---
host    all             all               all              reject
