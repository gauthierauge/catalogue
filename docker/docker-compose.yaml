services:
  postgres:
    image: postgres:17-alpine
    container_name: catalogue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
      - app_user_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - catalogue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: catalogue-backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
      - app_user_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - catalogue
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:

networks:
  catalogue:
    driver: bridge
    internal: false

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_user_password:
    file: ./secrets/app_user_password.txt
