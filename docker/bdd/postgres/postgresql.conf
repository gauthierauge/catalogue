# =============================================================================
# PostgreSQL 17 — Configuration durcie pour le projet Catalogue
# =============================================================================
# Ce fichier est monté en read-only dans le conteneur via docker-compose.
# Postgres est démarré avec : -c config_file=/etc/postgresql/postgresql.conf

# --- Réseau ---
listen_addresses = '*'
port = 5432
max_connections = 50

# --- Authentification ---
password_encryption = scram-sha-256

# --- Logging ---
log_connections = on
log_disconnections = on
log_statement = 'ddl'
log_min_duration_statement = 1000
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'UTC'

# --- Timeouts ---
statement_timeout = 30000
idle_in_transaction_session_timeout = 60000
authentication_timeout = 30

# --- Maintenance ---
autovacuum = on

# --- WAL / Réplication ---
wal_level = replica
