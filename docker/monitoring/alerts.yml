groups:
  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is unreachable since 1 minute."

      - alert: PostgresTooManyConnections
        expr: pg_stat_activity_count > 40
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many PostgreSQL connections"
          description: "{{ $value }} active connections on {{ $labels.instance }} (threshold: 40/50)."

      - alert: PostgresDeadlocks
        expr: rate(pg_stat_database_deadlocks_total[1m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "Deadlocks detected on database {{ $labels.datname }}."

      - alert: PostgresDiskSpaceCritical
        expr: pg_database_size_bytes > 5e9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database size critical"
          description: "Database {{ $labels.datname }} exceeds 5 GB (current: {{ $value | humanize1024 }})."
